name: Delete Azure Resources

on:
  # schedule:
  #   # - cron: '0 */6 * * *'
  #   #   timezone: 'Asia/Kolkata'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  delete-resources:
    runs-on: ubuntu-latest

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Delete All Resource Groups
        shell: pwsh
        run: |
          az group list --query "[].name" -o tsv | ForEach-Object { az group delete --name $_ --no-wait --yes }
